<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>text</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.container{
  width:90%;
  max-width:380px;
  text-align:center;
}
h1{
  font-size:48px;
  font-weight:400;
  letter-spacing:8px;
  margin-bottom:10px;
}
.subtitle{
  color:#888;
  margin-bottom:40px;
}
input,select,button{
  width:100%;
  padding:16px;
  margin:9px 0;
  border:1px solid #444;
  border-radius:8px;
  background:#111;
  color:white;
  font-size:16px;
}
button{
  background:white;
  color:black;
  font-weight:bold;
  border:0;
  margin-top:20px;
}
.footer{
  color:#666;
  font-size:12px;
  margin-top:35px;
}
</style>
</head>
<body>
<div class="container">
  <h1>text</h1>
  <p class="subtitle">just us, in our little space.</p>

  <input type="password" placeholder="Secret room code">

  <select>
    <option value="">Choose your identity</option>
    <option value="snowman">snowman</option>
    <option value="Panda">Panda</option>
  </select>

  <input type="password" inputmode="numeric"
  maxlength="6" placeholder="Your 6-digit PIN">

  <button type="button">Enter our space</button>

  <p class="footer">A private place for two.</p>
</div>
</body>
</html>
